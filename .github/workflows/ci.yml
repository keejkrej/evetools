name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui-parity
      - run: pnpm --filter @evetools/chat-shell typecheck
      - run: pnpm --filter @evetools/chat test
      - run: pnpm --filter @evetools/draw test
      - run: pnpm --filter @evetools/chat build
      - run: pnpm --filter @evetools/draw build
